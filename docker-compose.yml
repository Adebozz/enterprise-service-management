# Local development stack.
# M0: PostgreSQL only. Backend and frontend services are added in M12.
#
#   cp .env.example .env
#   docker compose up -d
name: esm

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${ESM_DB_NAME:?set ESM_DB_NAME in .env}
      POSTGRES_USER: ${ESM_DB_USERNAME:?set ESM_DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${ESM_DB_PASSWORD:?set ESM_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${ESM_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
