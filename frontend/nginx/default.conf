# The web container is the single entry point: it serves the SPA and forwards /api to the backend,
# exactly like CloudFront in production. Same origin => no CORS, and the refresh cookie
# (Path=/api/auth, SameSite=Strict) works unchanged.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Hashed file names change whenever content changes, so they can be cached for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Client-side routes (/tickets/123) all serve index.html, which is never cached, so a new
    # deployment is picked up on the next page load.
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }
}
