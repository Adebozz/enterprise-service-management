# Included in every location: nginx drops inherited add_header directives as soon as a location
# declares its own, so putting these only at server level would silently lose them on /assets/.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Scripts only from this origin (no inline scripts). Styles need 'unsafe-inline': verified by
# removing it, after which Chrome blocks the inline style the Radix dialog's scroll lock injects.
# Allowing that exact style by its sha256 hash would be tighter, but would break silently whenever
# the library changes its CSS. Scripts, the real XSS vector, stay strict.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
