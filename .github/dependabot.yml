# Weekly dependency updates, grouped so minor/patch bumps arrive as one PR per ecosystem.
# Every update PR runs the full CI workflow before it can be merged.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      maven-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned to 5.x: openapi-typescript 7 declares a peer dependency on TypeScript ^5.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    ignore:
      # Runtime majors (Java 21 LTS, Node 22 LTS) are deliberate upgrades that also touch the pom,
      # setup-java/setup-node in CI and the docs, so they are done by hand, not by a bot PR.
      - dependency-name: '*'
        update-types: [version-update:semver-major]
