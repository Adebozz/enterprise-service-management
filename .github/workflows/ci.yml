# Continuous integration: every pull request and every push to main must pass all three jobs.
# Actions are pinned to full commit SHAs (tags can be moved; SHAs cannot), with the tag in a
# comment; Dependabot keeps them current.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a PR supersedes the previous run; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (unit + integration tests, coverage, formatting)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # verify = Spotless check, unit tests (Surefire), Testcontainers integration tests against
      # real PostgreSQL (Failsafe; the runner has Docker), the OpenAPI snapshot test, and the
      # JaCoCo coverage floors.
      - run: ./mvnw -B -ntp verify
      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/site/jacoco/
          retention-days: 14

  frontend:
    name: Frontend (lint, types, API contract, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Generated API types must match docs/openapi.json, which the backend job proves matches the code.
      - run: npm run check:api
      - run: npm test
      - run: npm run build

  stack:
    name: Docker images + end-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The example file holds development-only values; fine for a throwaway CI stack.
      - run: cp .env.example .env
      - name: Build images and start the stack (waits for every health check)
        run: docker compose up --build --wait --wait-timeout 300
      - run: ./scripts/smoke-test.sh
      - name: Container logs
        if: ${{ failure() }}
        run: docker compose logs --no-color
      - name: Stop the stack
        if: ${{ always() }}
        run: docker compose down --volumes
