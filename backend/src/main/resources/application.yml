# Base configuration shared by every environment.
# Environment-specific values come from environment variables (12-factor). For local development
# they are read from the repository-root .env file (copied from .env.example, git-ignored).
spring:
  application:
    name: esm-backend
  config:
    import:
      - optional:file:../.env[.properties]   # running from backend/ (IDE, ./mvnw spring-boot:run)
      - optional:file:.env[.properties]      # running from repo root
  datasource:
    url: ${ESM_DB_URL:}
    username: ${ESM_DB_USERNAME:}
    password: ${ESM_DB_PASSWORD:}
  jpa:
    # Schema is owned by Flyway. Hibernate only checks that entities match it, and fails fast if not.
    hibernate:
      ddl-auto: validate
    # Disable lazy loading during JSON rendering: it hides N+1 queries and holds DB connections
    # for the whole request. Services must load what the response needs, inside the transaction.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 100   # a client can't ask for ?size=1000000

server:
  error:
    include-stacktrace: never
    include-message: never
  shutdown: graceful

esm:
  security:
    jwt:
      secret: ${ESM_JWT_SECRET:}          # base64, >= 32 bytes; startup fails if missing or weak
      issuer: esm
      access-token-ttl: 15m
    refresh-token:
      session-lifetime: 7d             # absolute: rotation never extends a session
      reuse-grace-period: 30s
      cookie-name: esm_refresh
      cookie-secure: true
    # Browser origins allowed to call the cookie-authenticated endpoints (refresh/logout).
    allowed-origins: ${ESM_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  # Ticket priority = f(impact, urgency). Change the policy here, not in code. Every cell is
  # required; startup fails if one is missing. Documented in docs/architecture.md.
  priority:
    matrix:
      HIGH:   { HIGH: P1, MEDIUM: P2, LOW: P3 }
      MEDIUM: { HIGH: P2, MEDIUM: P3, LOW: P4 }
      LOW:    { HIGH: P3, MEDIUM: P4, LOW: P4 }
  bootstrap:
    admin:
      email: ${ESM_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${ESM_BOOTSTRAP_ADMIN_PASSWORD:}
      display-name: ${ESM_BOOTSTRAP_ADMIN_NAME:Administrator}

springdoc:
  # Explicit so the choice is visible; production disables both (see application-prod.yml).
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true   # /actuator/health/liveness and /actuator/health/readiness for ECS/ALB
  info:
    env:
      enabled: true

info:
  app:
    name: Enterprise Service Management
    version: '@project.version@'

logging:
  pattern:
    # Every log line carries the request correlation id (see CorrelationIdFilter).
    correlation: '[%X{correlationId:-}] '
